<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <p>Complete the required fields to register.</p>

    <form action="#" method="POST">
        <p>
            <label for="full-name">Full name:</label>
            <input type="text" id="full-name" name="full_name"
                   minlength="2" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password (at least 8 characters):</label>
            <input type="password" id="password" name="password"
                   minlength="8" required>
        </p>

        <fieldset>
            <legend>Learning level</legend>

            <input type="radio" id="beginner" name="level"
                   value="beginner" required>
            <label for="beginner">Beginner</label>

            <input type="radio" id="intermediate" name="level"
                   value="intermediate">
            <label for="intermediate">Intermediate</label>
        </fieldset>

        <p>
            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Choose your country</option>
                <option value="jordan">Jordan</option>
                <option value="saudi-arabia">Saudi Arabia</option>
                <option value="egypt">Egypt</option>
            </select>
        </p>

        <p>
            <label for="message">Message (optional):</label>
            <br>
            <textarea id="message" name="message"
                      rows="4" cols="30"></textarea>
        </p>

        <p>
            <input type="checkbox" id="terms" name="terms"
                   value="accepted" required>
            <label for="terms">I agree to the terms.</label>
        </p>

        <button type="submit">Register</button>
    </form>
</body>
</html>
